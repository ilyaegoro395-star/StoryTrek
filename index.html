<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StoryTrek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:            #F0F9FF;
  --panel:         #FFFFFF;
  --panel-2:       #EFF8FF;
  --input-bg:      rgba(14,165,233,0.06);
  --border:        rgba(14,165,233,0.15);
  --border-hi:     rgba(14,165,233,0.28);
  --accent:        #0EA5E9;
  --accent-dim:    rgba(14,165,233,0.1);
  --accent-glow:   rgba(14,165,233,0.2);
  --orange:        #F97316;
  --orange-dim:    rgba(249,115,22,0.1);
  --orange-glow:   rgba(249,115,22,0.28);
  --red:           #EF4444;
  --text-1:        #0C2A3E;
  --text-2:        #4A7A9B;
  --text-3:        #94B8CC;
  --nav-h:         64px;
  --r-panel:       20px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  -webkit-tap-highlight-color: transparent;
}

/* ── full-screen map ── */
#map { position: fixed; inset: 0; z-index: 0; }

/* ── bottom sheets ── */
#card, #explore-panel {
  position: fixed;
  bottom: var(--nav-h); left: 0; right: 0;
  z-index: 20;
  max-height: calc(82vh - var(--nav-h));
  background: var(--panel);
  border-radius: var(--r-panel) var(--r-panel) 0 0;
  border: 1px solid var(--border-hi);
  border-bottom: none;
  box-shadow: 0 -8px 32px rgba(14,165,233,0.12), 0 -1px 0 rgba(14,165,233,0.18);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(110%);
  transition: transform 0.38s cubic-bezier(0.32,0,0.15,1);
}
#card.peek, #explore-panel.peek {
  transform: translateY(calc(100% - 44px));
}
#card.open, #explore-panel.open { transform: translateY(0); }

/* handle */
.sheet-handle {
  width: 100%; height: 32px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; touch-action: none;
}
.sheet-handle::after {
  content: '';
  width: 44px; height: 4px;
  background: rgba(14,165,233,0.22);
  border-radius: 100px;
  transition: background .2s, width .2s;
}
.sheet-handle:hover::after { background: rgba(14,165,233,0.42); width: 56px; }

/* header */
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 18px 12px; flex-shrink: 0;
}
.logo {
  font-size: 19px; font-weight: 700; color: var(--text-1);
  letter-spacing: -0.5px;
}
.logo span {
  background: linear-gradient(90deg, #0EA5E9, #38BDF8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* card body */
.card-body {
  padding: 0 14px 14px;
  display: flex; flex-direction: column; gap: 9px;
  overflow-y: auto; flex: 1; min-height: 0;
}

/* ── inputs ── */
.input-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot-from { background: var(--accent); }
.dot-to   { background: var(--red); }

.addr-input {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 11px;
  color: var(--text-1);
  font-family: inherit;
  font-size: 14px;
  padding: 10px 13px;
  outline: none; min-width: 0;
  transition: border-color .18s, box-shadow .18s;
}
.addr-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.addr-input::placeholder { color: var(--text-3); }
.addr-input.confirmed {
  border-color: rgba(14,165,233,0.45);
  background: rgba(14,165,233,0.07);
}

.btn-loc {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--input-bg); border: 1px solid var(--border);
  color: var(--accent); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background .15s, border-color .15s;
}
.btn-loc:hover { background: var(--accent-dim); border-color: var(--accent); }

/* ── waypoint list ── */
#waypoint-list { display: flex; flex-direction: column; gap: 2px; }
.wp-row { display: flex; flex-direction: column; }
.wp-item { display: flex; align-items: center; gap: 5px; padding: 1px 0; }
.wp-item.dragging { opacity: 0.3; }
.drag-handle {
  width: 22px; height: 36px; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 18px; cursor: grab; flex-shrink: 0;
  user-select: none; touch-action: none; letter-spacing: -2px;
  transition: color .15s;
}
.drag-handle:hover { color: var(--accent); }
.wp-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.wp-remove {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  background: none; border: none; color: var(--text-3);
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: color .15s;
}
.wp-remove:hover { color: var(--red); }
#btn-add-wp {
  width: 100%; padding: 8px;
  background: none; border: 1px dashed rgba(14,165,233,0.25);
  color: var(--text-3); font-size: 13px; font-family: inherit;
  border-radius: 11px; cursor: pointer; margin-top: 2px;
  transition: border-color .18s, color .18s;
}
#btn-add-wp:hover { border-color: var(--accent); color: var(--accent); }
.btn-map-pick {
  width: 26px; height: 32px; border-radius: 7px; flex-shrink: 0;
  background: none; border: none; color: var(--text-3);
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: color .15s;
}
.btn-map-pick:hover { color: var(--accent); }
.btn-map-pick.active { color: var(--accent); }

/* ── transport mode ── */
#transport-mode { display: flex; gap: 8px; margin-top: 2px; }
.mode-btn {
  flex: 1; padding: 9px 4px;
  background: var(--input-bg); border: 1px solid var(--border);
  color: var(--text-3); font-size: 17px; font-family: inherit;
  border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s;
}
.mode-btn span { font-size: 11px; font-weight: 600; }
.mode-btn:hover { border-color: rgba(14,165,233,0.4); color: var(--text-2); }
.mode-btn.active {
  border-color: var(--accent);
  background: var(--accent-dim);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent-dim);
}

/* ── map pick crosshair ── */
#map-crosshair {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -100%);
  z-index: 25; display: none; pointer-events: none;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  font-size: 40px; line-height: 1;
}
#map-crosshair.visible { display: block; }
#map-pick-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--panel); border-top: 1px solid var(--border-hi);
  border-radius: var(--r-panel) var(--r-panel) 0 0;
  padding: 16px 18px 32px;
  z-index: 30; display: none;
  box-shadow: 0 -8px 40px rgba(14,165,233,0.14);
}
#map-pick-panel.visible { display: block; }
#mpp-addr {
  font-size: 14px; color: var(--text-1); font-weight: 500;
  margin-bottom: 14px; min-height: 20px; line-height: 1.4;
}
#mpp-done {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--accent), #0284C7);
  color: #fff; font-size: 15px; font-weight: 700;
  border: none; border-radius: 13px; cursor: pointer;
  font-family: inherit;
  transition: opacity .15s, transform .1s;
}
#mpp-done:hover { opacity: .9; }
#mpp-done:active { transform: scale(0.98); }

/* ── suggestions dropdown ── */
.sug-box {
  border-radius: 12px; border: 1px solid var(--border-hi);
  background: var(--panel-2); overflow: hidden;
  display: none; flex-direction: column;
  max-height: 220px; overflow-y: auto;
  box-shadow: 0 8px 24px rgba(14,165,233,0.15);
}
.sug-box.open { display: flex; }
.sug-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 13px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
}
.sug-item:last-child { border-bottom: none; }
.sug-item:hover { background: rgba(14,165,233,0.06); }
.sug-ico  { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; padding-top: 2px; opacity: .7; }
.sug-name { font-size: 13px; color: var(--text-1); font-weight: 500; line-height: 1.35; }
.sug-sub  { font-size: 11px; color: var(--text-2); line-height: 1.3; margin-top: 2px; }

/* ── route button (main CTA) ── */
#btn-route {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, #F97316, #E8530A);
  color: #fff; font-size: 14px; font-weight: 700;
  border: none; border-radius: 13px; cursor: pointer;
  font-family: inherit; letter-spacing: 0.2px;
  box-shadow: 0 4px 20px var(--orange-glow);
  transition: box-shadow .2s, opacity .15s, transform .1s;
  flex-shrink: 0;
}
#btn-route:hover    { box-shadow: 0 6px 28px rgba(249,115,22,0.45); }
#btn-route:active   { transform: scale(0.98); }
#btn-route:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

/* ── route stats strip ── */
#route-strip {
  display: none; align-items: center; justify-content: space-between;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 13px; padding: 10px 14px; flex-shrink: 0;
}
#route-strip.visible { display: flex; }
.rs-stat { text-align: center; }
.rs-val  { font-size: 15px; font-weight: 700; color: var(--accent); }
.rs-lbl  { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.btn-strip-clear {
  background: none; border: none; color: var(--text-3); font-size: 18px;
  cursor: pointer; line-height: 1; transition: color .15s;
}
.btn-strip-clear:hover { color: var(--text-1); }

/* ── guide & nav ── */
#guide-section { display: none; flex-direction: column; gap: 8px; flex-shrink: 0; }
#guide-section.visible { display: flex; }

#btn-guide {
  width: 100%; padding: 12px;
  background: rgba(14,165,233,0.07);
  color: var(--accent); font-size: 14px; font-weight: 600;
  border: 1px solid rgba(14,165,233,0.28); border-radius: 13px;
  cursor: pointer; font-family: inherit;
  transition: background .18s, border-color .18s, box-shadow .18s;
}
#btn-guide:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-dim);
}
#btn-guide:disabled { opacity: .35; cursor: not-allowed; }

/* guide text */
#guide-text-wrap { display: none; max-height: 200px; overflow-y: auto; }
#guide-text-wrap.visible { display: block; }
#guide-text {
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px;
  font-size: 13px; line-height: 1.75; color: var(--text-2);
}
.seg {
  padding: 7px 10px; border-radius: 8px; margin-bottom: 5px;
  cursor: pointer; transition: background .12s;
  border-left: 3px solid transparent;
}
.seg:last-child { margin-bottom: 0; }
.seg:hover  { background: rgba(14,165,233,0.06); }
.seg.active {
  background: var(--accent-dim);
  border-left-color: var(--accent); color: var(--text-1);
}

/* nav bar */
#nav-bar { display: none; align-items: center; gap: 6px; flex-shrink: 0; }
#nav-bar.visible { display: flex; }
#btn-nav-start {
  flex: 1; padding: 12px;
  background: linear-gradient(135deg, var(--accent), #0284C7);
  color: #fff; font-size: 14px; font-weight: 700;
  border: none; border-radius: 13px; cursor: pointer;
  font-family: inherit;
  transition: opacity .15s, transform .1s;
}
#btn-nav-start:hover { opacity: .9; }
#btn-nav-start:active { transform: scale(0.98); }
.nav-ctrl-btn {
  width: 42px; height: 42px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer; display: none;
}
#btn-pause {
  background: var(--panel-2); border: 1px solid var(--border-hi);
  color: var(--text-1);
  transition: background .15s;
}
#btn-pause:hover { background: rgba(255,255,255,0.08); }
#btn-stop  {
  background: rgba(255,107,122,0.1); border: 1px solid rgba(255,107,122,0.3);
  color: var(--red);
  transition: background .15s;
}
#btn-stop:hover { background: rgba(255,107,122,0.18); }

/* status line */
#status {
  font-size: 12px; color: var(--text-3); text-align: center;
  min-height: 16px; flex-shrink: 0;
}
#status.info { color: var(--accent); }
#status.err  { color: var(--red); }

/* ── locate FAB ── */
#fab-locate {
  position: fixed; right: 14px; bottom: 14px; z-index: 25;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,0.96);
  border: 1px solid var(--border-hi);
  color: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 16px rgba(14,165,233,0.18);
  transition: background .15s, box-shadow .15s;
}
#fab-locate:hover {
  background: rgba(14,165,233,0.08);
  box-shadow: 0 4px 20px rgba(14,165,233,0.25);
}

/* ── explore panel — extra styles ── */
.explore-filters { display: flex; flex-direction: column; gap: 9px; margin-bottom: 4px; }
.explore-city-wrap { position: relative; }
#dist-filter { display: flex; gap: 6px; flex-wrap: wrap; }
.dist-btn {
  padding: 5px 13px;
  background: var(--input-bg); border: 1px solid var(--border);
  color: var(--text-3); font-size: 12px; font-weight: 600;
  border-radius: 100px; cursor: pointer; font-family: inherit;
  transition: all .18s;
}
.dist-btn:hover { border-color: rgba(14,165,233,0.4); color: var(--text-2); }
.dist-btn.active {
  border-color: var(--accent); background: var(--accent-dim); color: var(--accent);
}
#explore-cards { display: flex; flex-direction: column; gap: 13px; padding-bottom: 18px; }
.ec-card {
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden; cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .15s;
}
.ec-card:hover {
  border-color: rgba(14,165,233,0.4);
  box-shadow: 0 8px 28px rgba(14,165,233,0.14);
  transform: translateY(-1px);
}
.ec-img {
  width: 100%; height: 136px;
  display: flex; align-items: center; justify-content: center;
  font-size: 52px; position: relative; overflow: hidden;
}
.ec-img::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.45));
}
.ec-badge {
  position: absolute; top: 10px; left: 10px; z-index: 1;
  background: rgba(0,0,0,.55); color: #fff;
  font-size: 11px; font-weight: 600;
  padding: 4px 10px; border-radius: 100px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.12);
}
.ec-info { padding: 11px 14px 13px; }
.ec-name { font-size: 15px; font-weight: 700; color: var(--text-1); margin-bottom: 5px; }
.ec-desc { font-size: 12px; color: var(--text-2); line-height: 1.45; margin-bottom: 8px; }
.ec-foot { display: flex; align-items: center; justify-content: space-between; }
.ec-city { font-size: 11px; color: var(--text-3); }
.ec-type { font-size: 11px; color: var(--text-3); }

/* ── bottom navigation bar ── */
#bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-h); z-index: 25;
  background: rgba(255,255,255,0.97);
  border-top: 1px solid var(--border-hi);
  display: flex; align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom, 0);
  backdrop-filter: blur(16px) saturate(150%);
}
.nav-icon {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  background: none; border: none; cursor: pointer;
  color: var(--text-3); transition: color .2s;
  position: relative;
}
.nav-icon svg { width: 22px; height: 22px; stroke-width: 1.7; }
.nav-icon .nav-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; font-family: inherit; }
.nav-icon:hover { color: var(--text-2); }
.nav-icon.active { color: var(--accent); }
.nav-icon.active::after {
  content: '';
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

/* ── position marker ── */
@keyframes pos-pulse {
  0%   { transform:scale(1);   opacity:.7 }
  70%  { transform:scale(2.3); opacity:0  }
  100% { transform:scale(2.3); opacity:0  }
}
.my-pos-ripple { position:absolute; left:-10px; top:-10px; width:20px; height:20px; border-radius:50%; background:rgba(14,165,233,.3); animation:pos-pulse 2s ease-out infinite; }
.my-pos-dot    { position:absolute; left:-8px;  top:-8px;  width:16px; height:16px; border-radius:50%; background:#0EA5E9; border:3px solid #fff; box-shadow:0 2px 10px rgba(14,165,233,.35); }

</style>
</head>
<body>

<div id="map"></div>

<!-- route builder panel -->
<div id="card">
  <div class="sheet-handle" id="sheet-handle"></div>
  <div class="card-head">
    <div class="logo">Story<span>Trek</span></div>
  </div>

  <div class="card-body">

    <div id="waypoint-list"></div>
    <button id="btn-add-wp">+ Промежуточная точка</button>

    <div id="transport-mode">
      <button class="mode-btn active" data-mode="foot">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="4" r="1.5"/><path d="M7 22l2.5-6.5L12 18l2-4 3 8M12 6l-2 5h4l-1 3"/>
        </svg>
        <span>Пешком</span>
      </button>
      <button class="mode-btn" data-mode="bike">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
          <path d="M5.5 17.5L9 9l3 2.5L15 9h3M12 9l-1.5-4.5"/><circle cx="15" cy="4.5" r="1"/>
        </svg>
        <span>Велосипед</span>
      </button>
    </div>

    <button id="btn-route" disabled>Построить маршрут →</button>

    <!-- stats after route -->
    <div id="route-strip">
      <div class="rs-stat"><div class="rs-val" id="rs-dist">—</div><div class="rs-lbl">расстояние</div></div>
      <div class="rs-stat"><div class="rs-val" id="rs-dur">—</div><div class="rs-lbl" id="rs-mode-lbl">пешком</div></div>
      <button class="btn-strip-clear" id="btn-clear">✕</button>
    </div>

    <!-- guide -->
    <div id="guide-section">
      <button id="btn-guide">✦ Создать аудиогид</button>

      <div id="nav-bar">
        <button id="btn-nav-start">▶ Навигация</button>
        <button class="nav-ctrl-btn" id="btn-pause">⏸</button>
        <button class="nav-ctrl-btn" id="btn-stop">■</button>
      </div>

      <div id="guide-text-wrap"><div id="guide-text"></div></div>
    </div>

    <div id="status"></div>

  </div>
</div>

<!-- explore: suggested routes panel -->
<div id="explore-panel">
  <div class="sheet-handle" id="explore-handle"></div>
  <div class="card-head">
    <div class="logo">Готовые маршруты</div>
  </div>
  <div class="card-body">
    <div class="explore-filters">
      <div class="explore-city-wrap">
        <input id="explore-city" class="addr-input" type="text" placeholder="Город" value="Череповец" autocomplete="off">
      </div>
      <div id="dist-filter">
        <button class="dist-btn active" data-km="0">Любое</button>
        <button class="dist-btn" data-km="3">до 3 км</button>
        <button class="dist-btn" data-km="5">до 5 км</button>
        <button class="dist-btn" data-km="10">до 10 км</button>
        <button class="dist-btn" data-km="20">до 20 км</button>
      </div>
    </div>
    <div id="explore-cards"></div>
  </div>
</div>

<button id="fab-locate" title="Моё местоположение">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
    <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>

<script src="https://api-maps.yandex.ru/2.1/?apikey=6a51cb53-ed6a-4d80-b294-bc082028e4ac&lang=ru_RU&load=package.full" type="text/javascript"></script>
<script>
'use strict';

/* ─── state ─── */
let ymap = null;
let myMarker = null;
let myPos    = null;
let posWatch = null;

let waypoints = [null, null];  // array of {lat, lng, text} or null

let routeCoords    = [];
let routeDistance  = 0;
let routeLine      = null;
let routeMarkers = [];

let segments  = [];
let segCoords = [];
let currentSeg = -1;
let audio = null;
let playGen = 0;
let navActive = false;
let navPaused = false;

let sugTimers     = [];
let activeSug     = -1;
let mapPickIdx    = -1;
let drag          = null;
let transportMode = 'foot';
let mapPickTimer  = null;
let myCity        = '';
let storyMarkers  = [];

/* ─── DOM ─── */
const btnRoute    = document.getElementById('btn-route');
const routeStrip  = document.getElementById('route-strip');
const rsDist      = document.getElementById('rs-dist');
const rsDur       = document.getElementById('rs-dur');
const btnClear    = document.getElementById('btn-clear');
const guideSec    = document.getElementById('guide-section');
const btnGuide    = document.getElementById('btn-guide');
const navBar      = document.getElementById('nav-bar');
const btnNavStart = document.getElementById('btn-nav-start');
const btnPause    = document.getElementById('btn-pause');
const btnStop     = document.getElementById('btn-stop');
const guideWrap   = document.getElementById('guide-text-wrap');
const guideText   = document.getElementById('guide-text');
const statusEl    = document.getElementById('status');

/* ─── map init ─── */
ymaps.ready(() => {
  ymap = new ymaps.Map('map', {
    center: [55.751244, 37.618423], zoom: 12, controls: ['zoomControl']
  }, { suppressMapOpenError: true });
  ymap.controls.get('zoomControl').options.set({ position: { right: 14, top: 80 } });
  startPosWatch();
  renderWaypointList();

  ymap.events.add('boundschange', () => {
    if (mapPickIdx < 0) return;
    clearTimeout(mapPickTimer);
    const addrEl = document.getElementById('mpp-addr');
    if (addrEl) addrEl.textContent = 'Определяем адрес…';
    mapPickTimer = setTimeout(() => {
      const center = ymap.getCenter();
      geocodeCenter(center[0], center[1]);
    }, 600);
  });
});

async function geocodeCenter(lat, lng) {
  let text = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  try {
    const r = await fetch(`/api/geocode?lat=${lat}&lng=${lng}`);
    if (r.ok) {
      const data = await r.json();
      if (data.text) text = data.text;
    }
  } catch { }
  const addrEl = document.getElementById('mpp-addr');
  if (addrEl) addrEl.textContent = text;
  const doneBtn = document.getElementById('mpp-done');
  if (doneBtn) { doneBtn.dataset.lat = lat; doneBtn.dataset.lng = lng; doneBtn.dataset.text = text; }
}

/* ─── geolocation ─── */
async function detectCity(lat, lng) {
  try {
    const r = await fetch(`/api/geocode?lat=${lat}&lng=${lng}`);
    if (!r.ok) return;
    const data = await r.json();
    if (data.text) {
      /* Russian address format: "Россия, Регион, Город, улица, дом" */
      const parts = data.text.split(', ');
      /* city is typically 3rd part (index 2) — skip country + region */
      if (parts.length >= 3) myCity = parts[2];
    }
  } catch {}
}

function startPosWatch() {
  if (!navigator.geolocation) return;
  posWatch = navigator.geolocation.watchPosition(
    pos => {
      const isFirst = !myPos;
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      setMyMarker([myPos.lat, myPos.lng]);
      if (isFirst) detectCity(myPos.lat, myPos.lng);
      if (navActive && !navPaused) onNavPosition(myPos);
    },
    () => {},
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function setMyMarker(coord) {
  if (!myMarker) {
    const L = ymaps.templateLayoutFactory.createClass(
      '<div class="my-pos-ripple"></div><div class="my-pos-dot"></div>'
    );
    myMarker = new ymaps.Placemark(coord, {}, {
      iconLayout: L,
      iconShape: { type: 'Circle', coordinates: [0,0], radius: 12 }
    });
    ymap.geoObjects.add(myMarker);
  } else {
    myMarker.geometry.setCoordinates(coord);
  }
}

document.getElementById('fab-locate').addEventListener('click', () => {
  if (myPos) ymap.setCenter([myPos.lat, myPos.lng], 15, { duration: 400 });
  else navigator.geolocation?.getCurrentPosition(
    p => ymap.setCenter([p.coords.latitude, p.coords.longitude], 15, { duration: 400 })
  );
});

async function useMyLoc() {
  if (!navigator.geolocation) return;
  setStatus('Определяем местоположение…', 'info');
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    waypoints[0] = { lat, lng, text: 'Моё местоположение' };
    try {
      const r = await fetch(`/api/geocode?lat=${lat}&lng=${lng}`);
      if (r.ok) {
        const data = await r.json();
        if (data.text) waypoints[0].text = data.text;
      }
    } catch { }
    renderWaypointList();
    updateBtn();
    setStatus('');
  }, () => setStatus('Нет доступа к геолокации', 'err'));
}

/* ─── panel open/close ─── */
const card         = document.getElementById('card');
const explorePanel = document.getElementById('explore-panel');
const NAV_H        = 64;

function updateFab() {
  const fab = document.getElementById('fab-locate');
  let panelH = 0;
  if (card.classList.contains('open'))              panelH = card.offsetHeight;
  else if (explorePanel.classList.contains('open')) panelH = explorePanel.offsetHeight;
  fab.style.bottom = (NAV_H + panelH + 14) + 'px';
}
new ResizeObserver(updateFab).observe(card);
new ResizeObserver(updateFab).observe(explorePanel);
updateFab();

function peekPanel(which) {
  const el    = which === 'route' ? card : explorePanel;
  const other = which === 'route' ? explorePanel : card;
  el.classList.remove('open');
  el.classList.add('peek');
  other.classList.remove('open', 'peek');
  document.getElementById(which === 'route' ? 'nav-route' : 'nav-explore').classList.add('active');
  document.getElementById(which === 'route' ? 'nav-explore' : 'nav-route').classList.remove('active');
  updateFab();
}

function openPanel(which) {
  const el    = which === 'route' ? card : explorePanel;
  const other = which === 'route' ? explorePanel : card;
  el.classList.add('open');
  el.classList.remove('peek');
  other.classList.remove('open', 'peek');
  document.getElementById(which === 'route' ? 'nav-route' : 'nav-explore').classList.add('active');
  document.getElementById(which === 'route' ? 'nav-explore' : 'nav-route').classList.remove('active');
  if (which === 'explore') renderCatalog();
  updateFab();
}

function hidePanel(which) {
  const el = which === 'route' ? card : explorePanel;
  el.classList.remove('open', 'peek');
  document.getElementById(which === 'route' ? 'nav-route' : 'nav-explore').classList.remove('active');
  updateFab();
}

function togglePanel(which) {
  const el = which === 'route' ? card : explorePanel;
  if (el.classList.contains('open')) hidePanel(which);
  else openPanel(which);
}

/* ── swipe gesture on both handles ── */
function addPanelSwipe(panel, handleEl, which) {
  let startY = 0, startOpen = false, moved = false;

  handleEl.addEventListener('touchstart', e => {
    startY    = e.touches[0].clientY;
    startOpen = panel.classList.contains('open');
    moved     = false;
    panel.style.transition = 'none';
  }, { passive: true });

  handleEl.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > 4) moved = true;
    const peekOffset = panel.offsetHeight - 36;
    const offset = startOpen
      ? Math.max(0, Math.min(peekOffset, dy))          /* от open: только вниз */
      : Math.max(0, peekOffset + Math.min(0, dy));     /* от peek: только вверх */
    panel.style.transform = `translateY(${offset}px)`;
  }, { passive: true });

  handleEl.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    panel.style.transition = '';
    panel.style.transform  = '';
    if (!moved) {
      togglePanel(which);
    } else if (startOpen && dy > 80) {
      hidePanel(which);
    } else if (!startOpen && dy < -60) {
      openPanel(which);
    }
    /* иначе CSS класс "snap back" сам вернёт в нужное положение */
    updateFab();
  });
}

addPanelSwipe(card, document.getElementById('sheet-handle'), 'route');
addPanelSwipe(explorePanel, document.getElementById('explore-handle'), 'explore');

document.getElementById('nav-route').addEventListener('click', () => {
  if (card.classList.contains('open')) hidePanel('route');
  else openPanel('route');
});
document.getElementById('nav-explore').addEventListener('click', () => {
  if (explorePanel.classList.contains('open')) hidePanel('explore');
  else openPanel('explore');
});
document.getElementById('nav-saved').addEventListener('click', () => {
  setStatus('Сохранённые маршруты — скоро', 'info');
});

/* panels start fully hidden — open on nav icon tap */

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function cleanText(s) {
  return s
    .replace(/\*\*([^*\n]+)\*\*/g, '$1')
    .replace(/\*([^*\n]+)\*/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^[-*+]\s+/gm, '')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .trim();
}

/* ─── waypoint rendering ─── */
function wpDotColor(i, n) {
  if (i === 0) return '#0EA5E9';
  if (i === n - 1) return '#F97316';
  return '#6B88A0';
}

function renderWaypointList() {
  const list = document.getElementById('waypoint-list');
  if (!list) return;
  list.innerHTML = '';
  waypoints.forEach((wp, i) => {
    const row = document.createElement('div');
    row.className = 'wp-row';
    const ph = i === 0 ? 'Откуда' : i === waypoints.length - 1 ? 'Куда' : 'Промежуточная точка';
    row.innerHTML = `
      <div class="wp-item" data-idx="${i}">
        <span class="wp-dot" style="background:${wpDotColor(i, waypoints.length)}"></span>
        <input class="addr-input wp-inp" type="text" placeholder="${ph}"
          autocomplete="off" spellcheck="false" data-idx="${i}"
          value="${wp ? esc(wp.text) : ''}">
        ${i === 0 ? '<button class="btn-loc" id="btn-my-loc" title="Моё место">⊙</button>' : ''}
        <button class="btn-map-pick" data-idx="${i}" title="Выбрать на карте">📍</button>
        ${waypoints.length > 2 ? `<button class="wp-remove" data-idx="${i}">✕</button>` : ''}
        <span class="drag-handle" data-idx="${i}">⠿</span>
      </div>
      <div class="sug-box wp-sug" data-idx="${i}"></div>`;
    if (wp) row.querySelector('.wp-inp').classList.add('confirmed');
    list.appendChild(row);
  });
  bindWaypointEvents();
}

function bindWaypointEvents() {
  document.querySelectorAll('.wp-inp').forEach(inp => {
    const i = parseInt(inp.dataset.idx);
    inp.addEventListener('input', e => {
      inp.classList.remove('confirmed');
      waypoints[i] = null;
      updateBtn();
      const val = e.target.value.trim();
      clearTimeout(sugTimers[i]);
      if (val.length < 2) { closeSug(i); return; }
      sugTimers[i] = setTimeout(() => fetchSug(i, val), 350);
    });
    inp.addEventListener('blur', () => setTimeout(() => closeSug(i), 200));
    inp.addEventListener('focus', () => {
      if (inp.value.trim().length >= 2) {
        clearTimeout(sugTimers[i]);
        sugTimers[i] = setTimeout(() => fetchSug(i, inp.value.trim()), 350);
      }
    });
  });

  const myLocBtn = document.getElementById('btn-my-loc');
  if (myLocBtn) myLocBtn.addEventListener('click', useMyLoc);

  document.querySelectorAll('.btn-map-pick').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx);
      if (mapPickIdx === i) { cancelMapPick(); return; }
      activateMapPick(i);
    });
  });

  document.querySelectorAll('.wp-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx);
      waypoints.splice(i, 1);
      sugTimers.splice(i, 1);
      renderWaypointList();
      updateBtn();
    });
  });

  /* desktop drag & drop */
  document.querySelectorAll('.drag-handle').forEach(handle => {
    handle.setAttribute('draggable', 'true');
    handle.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', handle.dataset.idx);
      setTimeout(() => handle.closest('.wp-item').classList.add('dragging'), 0);
    });
    handle.addEventListener('dragend', () =>
      document.querySelectorAll('.wp-item').forEach(el => el.classList.remove('dragging', 'drag-over')));
    /* touch drag start */
    handle.addEventListener('touchstart', e => {
      const i = parseInt(handle.dataset.idx);
      drag = { idx: i, startY: e.touches[0].clientY };
      handle.closest('.wp-item').classList.add('dragging');
    }, { passive: true });
  });

  document.querySelectorAll('.wp-row').forEach(row => {
    row.addEventListener('dragover', e => {
      e.preventDefault();
      document.querySelectorAll('.wp-item').forEach(el => el.classList.remove('drag-over'));
      row.querySelector('.wp-item').classList.add('drag-over');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const src = parseInt(e.dataTransfer.getData('text/plain'));
      const dst = parseInt(row.querySelector('.wp-item').dataset.idx);
      if (src !== dst) {
        const [wp] = waypoints.splice(src, 1);
        waypoints.splice(dst, 0, wp);
        renderWaypointList(); updateBtn();
      }
      document.querySelectorAll('.wp-item').forEach(el => el.classList.remove('dragging', 'drag-over'));
    });
  });
}

/* touch drag move/end — listen on document so it works outside the handle */
document.addEventListener('touchmove', e => {
  if (!drag) return;
  const y = e.touches[0].clientY;
  const rows = [...document.querySelectorAll('.wp-row')];
  for (let i = 0; i < rows.length; i++) {
    if (i === drag.idx) continue;
    const r = rows[i].querySelector('.wp-item').getBoundingClientRect();
    const mid = r.top + r.height / 2;
    if ((i < drag.idx && y < mid) || (i > drag.idx && y > mid)) {
      [waypoints[drag.idx], waypoints[i]] = [waypoints[i], waypoints[drag.idx]];
      drag.idx = i;
      renderWaypointList();
      const el = document.querySelectorAll('.wp-item')[i];
      if (el) el.classList.add('dragging');
      break;
    }
  }
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!drag) return;
  document.querySelectorAll('.wp-item').forEach(el => {
    el.classList.remove('dragging');
    el.style.transform = '';
  });
  drag = null;
  renderWaypointList(); updateBtn();
});

document.getElementById('btn-add-wp').addEventListener('click', () => {
  waypoints.splice(waypoints.length - 1, 0, null);
  renderWaypointList(); updateBtn();
});

document.getElementById('transport-mode').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if (!btn || btn.dataset.mode === transportMode) return;
  transportMode = btn.dataset.mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
  if (routeCoords.length > 0) buildRoute();
});

/* ─── map pick mode ─── */
function activateMapPick(idx) {
  mapPickIdx = idx;
  card.classList.remove('open', 'peek');
  explorePanel.classList.remove('open', 'peek');
  document.getElementById('map-crosshair').classList.add('visible');
  document.getElementById('map-pick-panel').classList.add('visible');
  document.getElementById('mpp-addr').textContent = 'Переместите карту для выбора точки';
  document.querySelectorAll('.btn-map-pick').forEach(btn =>
    btn.classList.toggle('active', parseInt(btn.dataset.idx) === idx));
  const center = ymap.getCenter();
  geocodeCenter(center[0], center[1]);
}
function cancelMapPick() {
  mapPickIdx = -1;
  clearTimeout(mapPickTimer);
  document.getElementById('map-crosshair').classList.remove('visible');
  document.getElementById('map-pick-panel').classList.remove('visible');
  openPanel('route');
  document.querySelectorAll('.btn-map-pick').forEach(btn => btn.classList.remove('active'));
}

document.getElementById('mpp-done').addEventListener('click', () => {
  const doneBtn = document.getElementById('mpp-done');
  const lat  = parseFloat(doneBtn.dataset.lat);
  const lng  = parseFloat(doneBtn.dataset.lng);
  const text = doneBtn.dataset.text || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  const idx  = mapPickIdx;
  if (!isNaN(lat) && !isNaN(lng) && idx >= 0) {
    cancelMapPick();
    waypoints[idx] = { lat, lng, text };
    renderWaypointList();
    updateBtn();
  }
});

/* ─── suggestions ─── */
async function fetchSug(i, val) {
  try {
    const ll = myPos ? `&ll=${myPos.lat},${myPos.lng}` : '';
    /* bias toward current city: if query has no comma and city is known, append it */
    const q = (myCity && !val.includes(',')) ? `${val}, ${myCity}` : val;
    const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}${ll}`);
    if (!res.ok) { closeSug(i); return; }
    const items = await res.json();
    if (!items.length) { closeSug(i); return; }
    renderSug(i, items);
  } catch (e) {
    console.error('suggest err', e);
    closeSug(i);
  }
}

function renderSug(i, items) {
  const box = document.querySelector(`.wp-sug[data-idx="${i}"]`);
  if (!box || !items.length) { closeSug(i); return; }
  box.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'sug-item';
    div.innerHTML = `<span class="sug-ico">📍</span><div><div class="sug-name">${esc(item.text)}</div></div>`;
    div.addEventListener('pointerdown', e => e.preventDefault());
    div.addEventListener('click', () => {
      waypoints[i] = { lat: item.lat, lng: item.lng, text: item.text };
      const inp = document.querySelector(`.wp-inp[data-idx="${i}"]`);
      if (inp) { inp.value = item.text; inp.classList.add('confirmed'); }
      closeSug(i);
      updateBtn();
    });
    box.appendChild(div);
  });
  box.classList.add('open');
  activeSug = i;
}

function closeSug(i) {
  const box = document.querySelector(`.wp-sug[data-idx="${i}"]`);
  if (box) { box.classList.remove('open'); box.innerHTML = ''; }
  if (activeSug === i) activeSug = -1;
}

/* ─── routing ─── */
function updateBtn() {
  const confirmed = waypoints.filter(Boolean);
  btnRoute.disabled = confirmed.length < 2;
}

btnRoute.addEventListener('click', buildRoute);

function applyRouteStats(distM, durSec) {
  routeDistance = Math.round(distM);
  const d = routeDistance;
  const dm = Math.round(durSec / 60);
  rsDist.textContent = d >= 1000 ? `${(d/1000).toFixed(1)} км` : `${d} м`;
  rsDur.textContent  = dm >= 60 ? `${Math.floor(dm/60)} ч ${dm%60} мин` : `${dm} мин`;
  const lbl = document.getElementById('rs-mode-lbl');
  if (lbl) lbl.textContent = transportMode === 'bike' ? 'велосипед' : 'пешком';
}

async function buildRoute() {
  const pts = waypoints.filter(Boolean);
  if (pts.length < 2) return;
  waypoints.forEach((_, i) => closeSug(i));
  setStatus('Строим маршрут…', 'info');
  btnRoute.disabled = true;

  if (transportMode === 'foot') {
    /* пешком: параллельно Яндекс + OSRM, берём короткий (OSM знает тропинки) */
    const results = await Promise.allSettled([
      (async () => {
        const route = await ymaps.route(pts.map(p => [p.lat, p.lng]),
          { routingMode: 'pedestrian', avoidTrafficJams: false, mapStateAutoApply: false });
        let dist = 0, dur = 0;
        const coords = [];
        route.getPaths().each(path => {
          dist += path.getLength() || 0;
          dur  += path.getTime()   || 0;
          const c = path.geometry.getCoordinates();
          if (c) coords.push(...c);
        });
        if (coords.length < 2) throw new Error('empty');
        return { coords, dist, dur };
      })(),
      (async () => {
        const cs = pts.map(w => `${w.lng},${w.lat}`).join(';');
        const r = await fetch(
          `https://router.project-osrm.org/route/v1/foot/${cs}?overview=full&geometries=geojson`,
          { signal: AbortSignal.timeout(12000) });
        const d = await r.json();
        if (d.code !== 'Ok') throw new Error(d.message || 'OSRM error');
        const rt = d.routes[0];
        return { coords: rt.geometry.coordinates.map(c => [c[1], c[0]]),
                 dist: rt.distance, dur: rt.duration };
      })()
    ]);
    const valid = results.filter(r => r.status === 'fulfilled').map(r => r.value);
    if (valid.length > 0) {
      const best = valid.reduce((a, b) => a.dist <= b.dist ? a : b);
      routeCoords = best.coords;
      applyRouteStats(best.dist, best.dur);
      drawRoute(routeCoords, pts);
      routeStrip.classList.add('visible');
      guideSec.classList.add('visible');
      setStatus('');
    } else {
      setStatus('Не удалось построить маршрут', 'err');
    }
  } else {
    /* велосипед: Яндекс главный (знает велодорожки), OSRM запасной */
    let built = false;
    try {
      const route = await ymaps.route(pts.map(p => [p.lat, p.lng]),
        { routingMode: 'bicycle', avoidTrafficJams: false, mapStateAutoApply: false });
      let totalDist = 0, totalDur = 0;
      const allCoords = [];
      route.getPaths().each(path => {
        totalDist += path.getLength() || 0;
        totalDur  += path.getTime()   || 0;
        const coords = path.geometry.getCoordinates();
        if (coords) allCoords.push(...coords);
      });
      if (allCoords.length > 1) {
        routeCoords = allCoords;
        applyRouteStats(totalDist, totalDur);
        drawRoute(routeCoords, pts);
        routeStrip.classList.add('visible');
        guideSec.classList.add('visible');
        setStatus('');
        built = true;
      }
    } catch (e) { console.warn('Yandex bike route failed, trying OSRM:', e.message); }
    if (!built) {
      try {
        const cs = pts.map(w => `${w.lng},${w.lat}`).join(';');
        const r = await fetch(
          `https://router.project-osrm.org/route/v1/bike/${cs}?overview=full&geometries=geojson`,
          { signal: AbortSignal.timeout(12000) });
        const d = await r.json();
        if (d.code !== 'Ok') throw new Error(d.message || 'OSRM error');
        const rt = d.routes[0];
        routeCoords = rt.geometry.coordinates.map(c => [c[1], c[0]]);
        applyRouteStats(rt.distance, rt.duration);
        drawRoute(routeCoords, pts);
        routeStrip.classList.add('visible');
        guideSec.classList.add('visible');
        setStatus('');
      } catch (e) {
        setStatus('Не удалось построить маршрут: ' + e.message, 'err');
      }
    }
  }

  btnRoute.disabled = false;
}

function drawRoute(coords, pts) {
  clearRoute();
  routeLine = new ymaps.GeoObject(
    { geometry: { type: 'LineString', coordinates: coords } },
    { geodesic: false, strokeWidth: 5, strokeColor: '#0EA5E9', strokeOpacity: 0.92 }
  );
  ymap.geoObjects.add(routeLine);
  pts.forEach((p, i) => {
    const m = new ymaps.Placemark([p.lat, p.lng], {}, {
      preset: 'islands#circleIcon',
      iconColor: i === 0 ? '#0EA5E9' : '#F97316'
    });
    ymap.geoObjects.add(m);
    routeMarkers.push(m);
  });
  const lats = coords.map(c => c[0]), lngs = coords.map(c => c[1]);
  ymap.setBounds([[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]],
    { checkZoomRange: true, duration: 600, margin: 60 });
}

function clearRoute() {
  if (routeLine) { ymap.geoObjects.remove(routeLine); routeLine = null; }
  routeMarkers.forEach(m => ymap.geoObjects.remove(m));
  routeMarkers = [];
  clearStoryMarkers();
}

/* ─── story point markers (izi.travel style) ─── */
function clearStoryMarkers() {
  storyMarkers.forEach(m => ymap.geoObjects.remove(m));
  storyMarkers = [];
}

function makeStoryLayout(n) {
  return ymaps.templateLayoutFactory.createClass(
    `<div style="background:#0EA5E9;color:#fff;width:28px;height:28px;border-radius:50%;` +
    `display:flex;align-items:center;justify-content:center;` +
    `font-family:Inter,sans-serif;font-size:11px;font-weight:700;` +
    `border:2.5px solid #fff;box-shadow:0 2px 10px rgba(14,165,233,0.45);` +
    `cursor:pointer;transform:translate(-50%,-50%)">${n}</div>`
  );
}

function drawStoryMarkers(points) {
  clearStoryMarkers();
  points.forEach((pt, i) => {
    const layout = makeStoryLayout(i + 1);
    const m = new ymaps.Placemark(
      [pt.lat, pt.lng],
      {
        balloonContentHeader: `<b style="font-family:Inter,sans-serif">${pt.name}</b>`,
        balloonContentBody:   `<p style="font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin:6px 0 0">${pt.story}</p>`
      },
      {
        iconLayout: layout,
        iconShape:  { type: 'Circle', coordinates: [0, 0], radius: 14 },
        iconImageSize:   [28, 28],
        iconImageOffset: [-14, -14]
      }
    );
    ymap.geoObjects.add(m);
    storyMarkers.push(m);
  });
}

async function geocodeAndDrawStoryPoints(rawPoints) {
  if (!rawPoints || !rawPoints.length) return;
  const ll = myPos ? `&ll=${myPos.lat},${myPos.lng}` : '';
  const settled = await Promise.allSettled(
    rawPoints.map(async pt => {
      const r = await fetch(`/api/geocode?q=${encodeURIComponent(pt.address)}${ll}`);
      const items = await r.json();
      if (!items || !items.length) throw new Error('not found');
      return { ...pt, lat: items[0].lat, lng: items[0].lng };
    })
  );
  const located = settled
    .filter(r => r.status === 'fulfilled')
    .map(r => r.value);
  if (located.length) drawStoryMarkers(located);
}

/* ─── guide generation ─── */
btnGuide.addEventListener('click', generateGuide);

async function generateGuide() {
  btnGuide.disabled = true;
  setStatus('Создаём аудиогид…', 'info');
  try {
    const r = await fetch('/api/generate-guide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        routeDescription: waypoints.filter(Boolean).map((p, i, a) =>
          i === 0 ? `Начало: «${p.text}»` : i === a.length-1 ? `Конец: «${p.text}»` : `Промежуточная точка: «${p.text}»`
        ).join('\n'),
        routeDistance,
        transportMode
      }),
      signal: AbortSignal.timeout(45000)
    });
    const data = await r.json();
    if (!data.text) throw new Error(data.error || 'No text');
    /* draw story points on map while guide loads */
    if (data.storyPoints && data.storyPoints.length) {
      geocodeAndDrawStoryPoints(data.storyPoints);
    }
    // Split on any paragraph break; further split long segments by sentence
    const rawSegs = data.text.split(/\n{2,}/).map(s => cleanText(s)).filter(Boolean);
    segments = rawSegs.flatMap(seg => {
      if (seg.length <= 1200) return [seg];
      // Segment too long — split on sentence boundaries
      return seg.split(/(?<=[.!?…])\s+/).reduce((acc, s) => {
        const last = acc[acc.length - 1] || '';
        if ((last + ' ' + s).length <= 1200) {
          acc[acc.length - 1] = (last ? last + ' ' : '') + s;
        } else {
          acc.push(s);
        }
        return acc;
      }, ['']);
    }).map(s => s.trim()).filter(Boolean);
    assignSegs();
    renderGuide();
    navBar.classList.add('visible');
    guideWrap.classList.add('visible');
    setStatus(`Готово — ${segments.length} фрагментов`);
  } catch (e) {
    setStatus('Ошибка: ' + e.message, 'err');
  } finally {
    btnGuide.disabled = false;
  }
}

function assignSegs() {
  if (!routeCoords.length) return;
  segCoords = segments.map((_, i) => {
    const idx = Math.round(i * (routeCoords.length - 1) / Math.max(segments.length - 1, 1));
    return routeCoords[Math.min(idx, routeCoords.length - 1)];
  });
}

function renderGuide() {
  guideText.innerHTML = '';
  segments.forEach((txt, i) => {
    const d = document.createElement('div');
    d.className = 'seg';
    d.textContent = txt;
    d.addEventListener('click', () => playSegment(i));
    guideText.appendChild(d);
  });
}

/* ─── TTS ─── */
async function synthesizeSeg(idx) {
  try {
    const r = await fetch('/api/synthesize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: cleanText(segments[idx]), voice: 'ermil', speed: '0.88' }),
      signal: AbortSignal.timeout(30000)
    });
    if (!r.ok) {
      const err = await r.text().catch(() => r.status);
      throw new Error(`HTTP ${r.status}: ${String(err).slice(0, 100)}`);
    }
    return await r.blob();
  } catch (e) {
    console.error('synthesize error:', e.message);
    setStatus('Ошибка синтеза: ' + e.message.slice(0, 200), 'err');
    return null;
  }
}

async function playSegment(idx) {
  const gen = ++playGen;
  if (audio) { audio.pause(); audio = null; }
  window.speechSynthesis?.cancel();
  if (idx < 0 || idx >= segments.length) return;
  document.querySelectorAll('.seg').forEach((el, i) => el.classList.toggle('active', i === idx));
  currentSeg = idx;
  setStatus('Загружаем аудио…', 'info');
  const blob = await synthesizeSeg(idx);
  if (gen !== playGen) return;
  if (!blob) { browserTTS(segments[idx]); return; }
  const url = URL.createObjectURL(blob);
  audio = new Audio(url);
  audio.onended = () => {
    URL.revokeObjectURL(url);
    setStatus('');
    if (navActive && !navPaused && currentSeg + 1 < segments.length) playSegment(currentSeg + 1);
  };
  audio.play().catch(e => { console.error('play error:', e); browserTTS(segments[idx]); });
  setStatus('');
}

function browserTTS(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  speechSynthesis.speak(u);
}

/* ─── navigation ─── */
btnNavStart.addEventListener('click', startNav);
btnPause.addEventListener('click', togglePause);
btnStop.addEventListener('click', stopNav);

function startNav() {
  navActive = true; navPaused = false;
  btnNavStart.style.display = 'none';
  btnPause.style.display = 'flex';
  btnStop.style.display  = 'flex';
  setStatus('Навигация активна', 'info');
  playSegment(0);
}
function togglePause() {
  navPaused = !navPaused;
  btnPause.textContent = navPaused ? '▶' : '⏸';
  if (navPaused && audio) audio.pause();
  else if (!navPaused && audio) audio.play().catch(() => {});
  setStatus(navPaused ? 'Пауза' : 'Навигация активна', 'info');
}
function stopNav() {
  navActive = false; navPaused = false;
  if (audio) { audio.pause(); audio = null; }
  window.speechSynthesis?.cancel();
  btnNavStart.style.display = '';
  btnPause.style.display = 'none';
  btnStop.style.display  = 'none';
  btnPause.textContent = '⏸';
  currentSeg = -1;
  document.querySelectorAll('.seg').forEach(el => el.classList.remove('active'));
  setStatus('');
}

function haversine(a, b) {
  const R = 6371000;
  const dLat = (b[0]-a[0])*Math.PI/180, dLng = (b[1]-a[1])*Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function onNavPosition(pos) {
  if (!navActive || navPaused || !segCoords.length) return;
  const me = [pos.lat, pos.lng];
  segCoords.forEach((coord, i) => {
    if (i <= currentSeg) return;
    if (haversine(me, coord) < 80) playSegment(i);
  });
}

let exploreCity  = 'Череповец';
let exploreMaxKm = 0;

function renderCatalog() {
  const cardsEl = document.getElementById('explore-cards');
  const city = exploreCity.trim().toLowerCase();
  const filtered = CATALOG.filter(r => {
    if (city && !r.city.toLowerCase().includes(city)) return false;
    if (exploreMaxKm > 0 && r.distKm > exploreMaxKm) return false;
    return true;
  });
  if (filtered.length === 0) {
    cardsEl.innerHTML = '<div style="color:#4a5568;text-align:center;padding:24px 0">Маршруты не найдены</div>';
    return;
  }
  cardsEl.innerHTML = filtered.map(r => {
    const dist = r.distKm >= 1 ? `${r.distKm} км` : `${r.distKm * 1000} м`;
    const dur  = r.durationMin >= 60
      ? `${Math.floor(r.durationMin/60)} ч ${r.durationMin % 60 ? r.durationMin%60+' мин' : ''}`
      : `${r.durationMin} мин`;
    const mode = r.type === 'foot' ? '🚶 Пешком' : '🚲 Велосипед';
    return `<div class="ec-card" onclick="loadCatalogRoute('${r.id}')">
      <div class="ec-img" style="background:${r.color}">
        <span>${r.emoji}</span>
        <div class="ec-badge">${dist} · ${dur}</div>
      </div>
      <div class="ec-info">
        <div class="ec-name">${r.name}</div>
        <div class="ec-desc">${r.desc}</div>
        <div class="ec-foot">
          <span class="ec-city">📍 ${r.city}</span>
          <span class="ec-type">${mode}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function loadCatalogRoute(id) {
  const route = CATALOG.find(r => r.id === id);
  if (!route) return;
  waypoints = route.points.map(p => ({ lat: p.lat, lng: p.lng, text: p.text }));
  transportMode = route.type;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === transportMode));
  openPanel('route');
  renderWaypointList();
  updateBtn();
  buildRoute();
}

document.getElementById('explore-city').addEventListener('input', e => {
  exploreCity = e.target.value;
  renderCatalog();
});

document.getElementById('dist-filter').addEventListener('click', e => {
  const btn = e.target.closest('.dist-btn');
  if (!btn) return;
  document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  exploreMaxKm = parseInt(btn.dataset.km);
  renderCatalog();
});

  statusEl.className   = type;

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>StoryTrek</title>
  <script src="https://api-maps.yandex.ru/2.1/?apikey=6a51cb53-ed6a-4d80-b294-bc082028e4ac&lang=ru_RU" type="text/javascript"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Map ───────────────────────────────────────── */
    #map {
      position: fixed; inset: 0; z-index: 0;
    }

    /* ── Top bar ────────────────────────────────────── */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 56px;
      padding: 0 20px;
      padding-top: env(safe-area-inset-top);
      background: rgba(13, 17, 23, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-size: 20px; font-weight: 700; color: #7ECBBD; letter-spacing: -0.3px;
    }
    .top-badge {
      font-size: 12px; font-weight: 600; color: #7ECBBD;
      background: rgba(126,203,189,0.12);
      border: 1px solid rgba(126,203,189,0.25);
      border-radius: 20px; padding: 4px 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .top-badge .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #7ECBBD;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Panels ─────────────────────────────────────── */
    .panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10, 14, 20, 0.97);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px 24px 0 0;
      padding: 10px 20px 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
    .handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.12); border-radius: 2px;
      margin: 0 auto 14px;
    }

    /* ── Waypoint inputs ────────────────────────────── */
    .waypoint-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px; position: relative;
    }
    .wp-line {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; flex-shrink: 0;
    }
    .wp-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }
    .wp-dot.start { background: #7ECBBD; box-shadow: 0 0 0 3px rgba(126,203,189,0.18); }
    .wp-dot.mid   { background: #E8845C; }
    .wp-dot.end   { background: transparent; border: 2.5px solid #7ECBBD; }
    .wp-connector { width: 2px; height: 8px; background: rgba(126,203,189,0.3); }

    .wp-input-wrap { flex: 1; position: relative; }
    .wp-input {
      width: 100%;
      background: #161d28; border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px; padding: 11px 14px;
      font-size: 14px; color: #fff; outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .wp-input:focus { border-color: rgba(126,203,189,0.5); }
    .wp-input::placeholder { color: rgba(255,255,255,0.25); }

    .wp-remove {
      width: 28px; height: 28px; flex-shrink: 0;
      background: rgba(255,255,255,0.07); border: none;
      border-radius: 50%; color: rgba(255,255,255,0.4);
      cursor: pointer; font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .wp-remove:hover { background: rgba(255,255,255,0.12); }

    /* Suggestions */
    .sug-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #1a2233; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; overflow: hidden;
      z-index: 300; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .sug-item {
      padding: 10px 14px; font-size: 13px; color: rgba(255,255,255,0.75);
      cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.1s;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: rgba(126,203,189,0.1); color: #fff; }

    /* ── Action buttons ─────────────────────────────── */
    .actions {
      display: flex; gap: 8px; margin-top: 12px;
    }
    .btn-primary {
      flex: 1; padding: 14px;
      background: #7ECBBD; color: #052e28;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-ghost {
      padding: 14px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: rgba(255,255,255,0.65);
      font-size: 15px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.11); }

    /* ── Route info panel ───────────────────────────── */
    .route-stats {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .stat-chip {
      background: rgba(126,203,189,0.08);
      border: 1px solid rgba(126,203,189,0.15);
      border-radius: 10px; padding: 8px 14px;
      font-size: 14px; font-weight: 600; color: #fff;
      display: flex; align-items: center; gap: 6px;
    }

    /* Guide status */
    .guide-status {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; margin-bottom: 12px;
      background: rgba(126,203,189,0.06);
      border: 1px solid rgba(126,203,189,0.12);
      border-radius: 12px;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #7ECBBD; flex-shrink: 0;
      animation: blink 1.5s ease-in-out infinite;
    }
    .guide-status span { font-size: 13px; color: rgba(255,255,255,0.65); }

    /* ── Navigation panel ───────────────────────────── */
    .nav-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    }
    .live-label {
      flex: 1; font-size: 13px; font-weight: 600; color: #7ECBBD;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-ctrl-row { display: flex; gap: 6px; }
    .ctrl-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.08); border: none;
      border-radius: 10px; color: #fff; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.13); }

    /* Narration card */
    .narr-card {
      background: #161d28; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 12px 14px; margin-bottom: 12px;
    }
    .waveform {
      height: 32px; display: flex; align-items: center; gap: 2px; margin-bottom: 8px;
    }
    .wave-bar {
      flex: 1; background: rgba(126,203,189,0.45); border-radius: 1px;
      animation: wave 1.4s ease-in-out infinite; transform-origin: center;
    }
    @keyframes wave { 0%,100%{transform:scaleY(0.18);opacity:0.35} 50%{transform:scaleY(1);opacity:1} }
    .wave-bar.paused { animation-play-state: paused; }
    .narr-text {
      font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.6; font-style: italic;
      max-height: 80px; overflow-y: auto;
    }

    /* Progress */
    .prog-row { display: flex; align-items: center; gap: 10px; }
    .prog-track {
      flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
    }
    .prog-fill { height: 100%; background: #7ECBBD; border-radius: 2px; transition: width 0.6s ease; }
    .prog-label { font-size: 12px; color: rgba(255,255,255,0.35); white-space: nowrap; }

    /* ── FAB (locate me) ────────────────────────────── */
    .fab {
      position: fixed; right: 16px; bottom: 240px; z-index: 50;
      width: 44px; height: 44px;
      background: rgba(10, 14, 20, 0.92);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: background 0.15s, transform 0.1s;
    }
    .fab:hover { background: rgba(30, 40, 55, 0.95); }
    .fab:active { transform: scale(0.95); }

    /* ── Loading overlay ────────────────────────────── */
    .loading {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(126,203,189,0.2); border-top-color: #7ECBBD;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: rgba(255,255,255,0.65); font-size: 14px; }

    /* ── Toast ──────────────────────────────────────── */
    .toast {
      position: fixed; top: 68px; left: 16px; right: 16px; z-index: 300;
      background: #3d1515; color: #fca5a5;
      border: 1px solid rgba(252,165,165,0.2);
      border-radius: 12px; padding: 12px 16px; font-size: 14px;
      display: none; animation: slideDown 0.25s ease;
    }
    @keyframes slideDown { from{transform:translateY(-16px);opacity:0} to{transform:translateY(0);opacity:1} }
  </style>
</head>
<body>

  <!-- Map -->
  <div id="map"></div>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="logo">StoryTrek</div>
    <div class="top-badge" id="top-badge" style="display:none">
      <div class="dot"></div>
      <span id="top-badge-text">В эфире</span>
    </div>
  </header>

  <!-- Loading -->
  <div class="loading" id="loading" style="display:none">
    <div class="spinner"></div>
    <p id="loading-text">Загрузка...</p>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Panel: IDLE — ввод маршрута -->
  <div class="panel" id="panel-idle">
    <div class="handle"></div>
    <div id="waypoints-list"></div>
    <div class="actions">
      <button class="btn-ghost" onclick="addWaypointField()">+ Точка</button>
      <button class="btn-primary" onclick="buildRoute()">Маршрут →</button>
    </div>
  </div>

  <!-- Panel: CONFIRMING — маршрут построен -->
  <div class="panel" id="panel-confirming" style="display:none">
    <div class="handle"></div>
    <div class="route-stats">
      <div class="stat-chip">📍 <span id="r-dist">—</span></div>
      <div class="stat-chip">⏱ <span id="r-time">—</span></div>
    </div>
    <div class="guide-status">
      <div class="pulse-dot" id="guide-dot"></div>
      <span id="guide-msg">Генерирую аудиогид...</span>
    </div>
    <div class="actions">
      <button class="btn-ghost" onclick="backToIdle()">← Изменить</button>
      <button class="btn-primary" id="btn-start" onclick="startNav()" disabled>▶ Старт</button>
    </div>
  </div>

  <!-- Panel: NAVIGATING — навигация -->
  <div class="panel" id="panel-navigating" style="display:none">
    <div class="nav-header">
      <div class="live-label">
        <div class="pulse-dot"></div>
        В эфире
      </div>
      <div class="nav-ctrl-row">
        <button class="ctrl-btn" id="btn-pause" onclick="togglePause()" title="Пауза">⏸</button>
        <button class="ctrl-btn" onclick="stopNav()" title="Завершить">⏹</button>
      </div>
    </div>
    <div class="narr-card">
      <div class="waveform" id="wf"></div>
      <p class="narr-text" id="narr-text">Готовлюсь к рассказу...</p>
    </div>
    <div class="prog-row">
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <span class="prog-label" id="prog-label">—</span>
    </div>
  </div>

  <!-- FAB locate me -->
  <button class="fab" onclick="locateMe()" title="Моё местоположение">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <path d="M12 8a4 4 0 100 8 4 4 0 000-8z" stroke-width="1.5" opacity="0.4"/>
    </svg>
  </button>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const TRIGGER_DIST_M = 80;       // метров до точки, чтобы запустить фрагмент
const DEFAULT_CENTER  = [55.752, 37.622]; // Москва
const DEFAULT_ZOOM    = 12;

// ═══════════════════════════════════════════════════════
// GLOBALS
// ═══════════════════════════════════════════════════════
let ymap        = null;
let multiRoute  = null;
let userMarker  = null;
let watchId     = null;

let waypointValues = ['', ''];  // минимум 2 поля
let routeCoords    = [];        // [[lat,lon], ...] — координаты маршрута
let guideSegments  = [];        // [{text, triggerCoord, audioBlob}]
let segIdx         = 0;
let curAudio       = null;
let isAudioBusy    = false;
let isPaused       = false;
let routeTotalLen  = 0;

// ═══════════════════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════════════════
ymaps.ready(() => {
  ymap = new ymaps.Map('map', {
    center: DEFAULT_CENTER,
    zoom: DEFAULT_ZOOM,
    controls: ['zoomControl']
  }, { suppressMapOpenBlock: true });

  // Центрируем на пользователе при старте
  navigator.geolocation?.getCurrentPosition(pos => {
    ymap.setCenter([pos.coords.latitude, pos.coords.longitude], 14, { duration: 500 });
  }, () => {});

  renderWaypoints();
});

// ═══════════════════════════════════════════════════════
// PANELS
// ═══════════════════════════════════════════════════════
function showPanel(name) {
  ['idle', 'confirming', 'navigating'].forEach(n => {
    document.getElementById('panel-' + n).style.display = n === name ? 'block' : 'none';
  });
  const badge = document.getElementById('top-badge');
  badge.style.display = name === 'navigating' ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════════════
// WAYPOINTS UI
// ═══════════════════════════════════════════════════════
function addWaypointField() {
  waypointValues.splice(waypointValues.length - 1, 0, '');
  renderWaypoints();
}

function removeWaypointField(idx) {
  if (waypointValues.length <= 2) return;
  waypointValues.splice(idx, 1);
  renderWaypoints();
}

function renderWaypoints() {
  const container = document.getElementById('waypoints-list');
  container.innerHTML = '';

  waypointValues.forEach((val, i) => {
    const isStart = i === 0;
    const isEnd   = i === waypointValues.length - 1;
    const dotCls  = isStart ? 'start' : isEnd ? 'end' : 'mid';
    const ph      = isStart ? 'Откуда...' : isEnd ? 'Куда...' : 'Промежуточная точка...';

    const row = document.createElement('div');
    row.className = 'waypoint-row';
    row.innerHTML = `
      <div class="wp-line">
        <div class="wp-dot ${dotCls}"></div>
        ${!isEnd ? '<div class="wp-connector"></div>' : ''}
      </div>
      <div class="wp-input-wrap">
        <input class="wp-input" data-idx="${i}" type="text"
               placeholder="${ph}" value="${escHtml(val)}" autocomplete="off">
        <div class="sug-list" id="sug-${i}"></div>
      </div>
      ${waypointValues.length > 2
        ? `<button class="wp-remove" onclick="removeWaypointField(${i})" aria-label="Удалить">×</button>`
        : ''}
    `;
    container.appendChild(row);

    const input = row.querySelector('.wp-input');
    input.addEventListener('input', () => {
      waypointValues[i] = input.value;
      debounceSuggest(i, input.value);
    });
    input.addEventListener('blur', () => setTimeout(() => hideSug(i), 200));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') hideSug(i); });
  });
}

const sugTimers = {};
function debounceSuggest(idx, val) {
  clearTimeout(sugTimers[idx]);
  if (val.length < 2) { hideSug(idx); return; }
  sugTimers[idx] = setTimeout(() => fetchSug(idx, val), 280);
}

async function fetchSug(idx, val) {
  try {
    const results = await ymaps.suggest(val, { results: 5 });
    const list = document.getElementById('sug-' + idx);
    if (!list) return;
    if (!results.length) { hideSug(idx); return; }

    list.innerHTML = results
      .map(r => `<div class="sug-item" data-val="${escAttr(r.value)}">${escHtml(r.displayName)}</div>`)
      .join('');
    list.style.display = 'block';

    list.querySelectorAll('.sug-item').forEach(item => {
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        const v = item.dataset.val;
        waypointValues[idx] = v;
        document.querySelector(`.wp-input[data-idx="${idx}"]`).value = v;
        hideSug(idx);
      });
    });
  } catch (_) {}
}

function hideSug(idx) {
  const el = document.getElementById('sug-' + idx);
  if (el) { el.innerHTML = ''; el.style.display = 'none'; }
}

// ═══════════════════════════════════════════════════════
// ROUTE BUILDING
// ═══════════════════════════════════════════════════════
async function buildRoute() {
  const points = waypointValues.map(v => v.trim()).filter(Boolean);
  if (points.length < 2) { showToast('Укажите минимум две точки маршрута'); return; }

  showLoading('Строим маршрут...');

  try {
    if (multiRoute) { ymap.geoObjects.remove(multiRoute); multiRoute = null; }

    multiRoute = new ymaps.multiRouter.MultiRoute(
      { referencePoints: points, params: { routingMode: 'pedestrian' } },
      {
        routeStrokeColor: '#7ECBBD',
        routeStrokeWidth: 5,
        routeActiveStrokeColor: '#7ECBBD',
        routeActiveStrokeWidth: 5,
        wayPointStartIconFillColor: '#7ECBBD',
        wayPointFinishIconFillColor: '#E8845C',
        boundsAutoApply: true
      }
    );
    ymap.geoObjects.add(multiRoute);

    await new Promise((res, rej) => {
      multiRoute.model.events.add('requestsuccess', res);
      multiRoute.model.events.add('requesterror', rej);
      setTimeout(() => rej(new Error('timeout')), 18000);
    });

    const active = multiRoute.getActiveRoute();
    if (!active) throw new Error('No route');

    const dist = active.properties.get('distance');
    const dur  = active.properties.get('duration');
    document.getElementById('r-dist').textContent = dist?.text || '—';
    document.getElementById('r-time').textContent = dur?.text  || '—';

    routeCoords = extractCoords(active);
    routeTotalLen = calcLength(routeCoords);

    hideLoading();
    showPanel('confirming');

    // Генерируем гид в фоне
    generateGuide(points, dist?.text, dur?.text);

  } catch (e) {
    hideLoading();
    showToast('Не удалось построить маршрут. Проверьте адреса.');
  }
}

function extractCoords(activeRoute) {
  const coords = [];
  try {
    activeRoute.getPaths().each(path => {
      path.getSegments().each(seg => {
        const geo = seg.geometry;
        if (geo?.getCoordinates) {
          const pts = geo.getCoordinates();
          if (Array.isArray(pts) && pts.length) coords.push(...pts);
        }
      });
    });
  } catch (_) {}
  return coords;
}

// ═══════════════════════════════════════════════════════
// GUIDE GENERATION
// ═══════════════════════════════════════════════════════
async function generateGuide(points, distText, durText) {
  setGuideMsg('Генерирую аудиогид...', true);
  document.getElementById('btn-start').disabled = true;

  try {
    // Геокодируем точки для описания
    const names = await Promise.all(points.map(geocodeName));

    const desc = [
      `Маршрут: от «${names[0]}» до «${names[names.length - 1]}»`,
      names.length > 2 ? `Промежуточные точки: ${names.slice(1, -1).join(', ')}` : null,
      `Расстояние: ${distText || '—'}, время пешком: ${durText || '—'}`,
      `Полный маршрут: ${names.join(' → ')}`
    ].filter(Boolean).join('\n');

    const res = await fetch('/api/generate-guide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ routeDescription: desc })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const { text, error } = await res.json();
    if (error) throw new Error(error);
    if (!text) throw new Error('empty');

    // Разбиваем на абзацы и привязываем к точкам маршрута
    const paras = text.split(/\n\n+/).map(s => s.trim()).filter(s => s.length > 15);
    guideSegments = paras.map((t, i) => {
      const ratio = paras.length > 1 ? i / (paras.length - 1) : 0;
      const ci = Math.min(
        Math.floor(ratio * (routeCoords.length - 1)),
        routeCoords.length - 1
      );
      return { text: t, triggerCoord: routeCoords[ci] || null, audioBlob: null };
    });

    // Синтезируем первый фрагмент
    await synthesizeSeg(0);

    setGuideMsg(`🎙 Аудиогид готов · ${guideSegments.length} фрагментов`, false);
    document.getElementById('btn-start').disabled = false;

  } catch (e) {
    setGuideMsg('Ошибка генерации. Попробуйте снова.', false);
    console.error('Guide error:', e);
  }
}

function setGuideMsg(text, pulsing) {
  document.getElementById('guide-msg').textContent = text;
  document.getElementById('guide-dot').style.animationPlayState = pulsing ? 'running' : 'paused';
}

async function geocodeName(address) {
  try {
    const r = await ymaps.geocode(address, { results: 1 });
    return r.geoObjects.get(0)?.getAddressLine() || address;
  } catch { return address; }
}

// ═══════════════════════════════════════════════════════
// TTS (Yandex SpeechKit via Netlify Function)
// ═══════════════════════════════════════════════════════
async function synthesizeSeg(idx) {
  if (idx >= guideSegments.length) return;
  if (guideSegments[idx].audioBlob) return; // уже готово

  try {
    const res = await fetch('/api/synthesize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: guideSegments[idx].text, voice: 'alena' })
    });
    if (!res.ok) throw new Error('TTS HTTP ' + res.status);
    guideSegments[idx].audioBlob = await res.blob();
  } catch (e) {
    console.warn('TTS failed, will use browser TTS:', e);
    guideSegments[idx].useBrowserTTS = true;
  }
}

function playSegment(idx) {
  if (idx >= guideSegments.length || isAudioBusy || isPaused) return;

  const seg = guideSegments[idx];
  if (!seg.audioBlob && !seg.useBrowserTTS) return; // ещё синтезируется

  // Обновляем текст в UI
  document.getElementById('narr-text').textContent = seg.text;
  setWavePlaying(true);

  if (curAudio) { curAudio.pause(); URL.revokeObjectURL(curAudio._url || ''); curAudio = null; }

  const onEnded = () => {
    isAudioBusy = false;
    segIdx = idx + 1;
    setWavePlaying(false);
    // Предзагружаем следующий фрагмент
    if (segIdx < guideSegments.length) synthesizeSeg(segIdx);
    if (segIdx >= guideSegments.length) {
      document.getElementById('narr-text').textContent = 'Маршрут завершён! Надеюсь, прогулка понравилась.';
    }
  };

  isAudioBusy = true;

  if (seg.useBrowserTTS) {
    // Fallback: браузерный TTS
    const utter = new SpeechSynthesisUtterance(seg.text);
    utter.lang = 'ru-RU'; utter.rate = 0.95;
    utter.onend = onEnded;
    speechSynthesis.speak(utter);
    return;
  }

  const url = URL.createObjectURL(seg.audioBlob);
  curAudio = new Audio(url);
  curAudio._url = url;
  curAudio.addEventListener('ended', onEnded);
  curAudio.play().catch(() => { isAudioBusy = false; setWavePlaying(false); });
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
async function startNav() {
  if (!guideSegments.length) { showToast('Аудиогид ещё не готов'); return; }

  segIdx = 0; isPaused = false; isAudioBusy = false;

  // Маркер пользователя
  userMarker = new ymaps.Placemark(DEFAULT_CENTER, {}, {
    iconLayout: ymaps.templateLayoutFactory.createClass(
      '<div style="width:18px;height:18px;background:#7ECBBD;border-radius:50%;border:3px solid #fff;' +
      'box-shadow:0 0 0 5px rgba(126,203,189,0.25);transform:translate(-9px,-9px);"></div>'
    ),
    iconShape: { type: 'Circle', coordinates: [0, 0], radius: 11 }
  });
  ymap.geoObjects.add(userMarker);

  // Вейвформ
  buildWaveform();

  showPanel('navigating');

  // Запускаем первый фрагмент сразу
  playSegment(0);

  // Геолокация
  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(
      onPosition,
      err => console.warn('Geo error', err.code, err.message),
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 12000 }
    );
  }
}

function onPosition(pos) {
  const coord = [pos.coords.latitude, pos.coords.longitude];

  if (userMarker) userMarker.geometry.setCoordinates(coord);
  ymap.panTo(coord, { flying: false, duration: 600 });

  // Прогресс
  if (routeCoords.length > 1 && routeTotalLen > 0) {
    const distToEnd = haversine(coord, routeCoords[routeCoords.length - 1]);
    const pct = Math.min(100, Math.max(0, (1 - distToEnd / routeTotalLen) * 100));
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('prog-label').textContent = fmtDist(distToEnd);
  }

  // Проверяем триггеры фрагментов
  if (!isAudioBusy && !isPaused) {
    for (let i = segIdx; i < guideSegments.length; i++) {
      const seg = guideSegments[i];
      if (!seg.triggerCoord) { segIdx = i; playSegment(i); break; }
      const d = haversine(coord, seg.triggerCoord);
      if (d < TRIGGER_DIST_M) { segIdx = i; playSegment(i); break; }
    }
  }
}

function stopNav() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (curAudio) { curAudio.pause(); curAudio = null; }
  speechSynthesis.cancel();
  isAudioBusy = false; isPaused = false;
  if (userMarker) { ymap.geoObjects.remove(userMarker); userMarker = null; }
  guideSegments = []; segIdx = 0;
  backToIdle();
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('btn-pause');
  if (isPaused) {
    curAudio?.pause();
    speechSynthesis.pause();
    setWavePlaying(false);
    btn.textContent = '▶';
    btn.title = 'Продолжить';
  } else {
    curAudio?.play();
    speechSynthesis.resume();
    setWavePlaying(true);
    btn.textContent = '⏸';
    btn.title = 'Пауза';
  }
}

function backToIdle() {
  if (multiRoute) { ymap.geoObjects.remove(multiRoute); multiRoute = null; }
  routeCoords = []; guideSegments = [];
  document.getElementById('btn-start').disabled = true;
  showPanel('idle');
}

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════
function haversine(a, b) {
  const R = 6371000;
  const φ1 = a[0] * Math.PI / 180, φ2 = b[0] * Math.PI / 180;
  const dφ = (b[0] - a[0]) * Math.PI / 180;
  const dλ = (b[1] - a[1]) * Math.PI / 180;
  const x = Math.sin(dφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

function calcLength(coords) {
  let len = 0;
  for (let i = 1; i < coords.length; i++) len += haversine(coords[i-1], coords[i]);
  return len || 1;
}

function fmtDist(m) {
  return m >= 1000 ? (m / 1000).toFixed(1) + ' км' : Math.round(m) + ' м';
}

function locateMe() {
  navigator.geolocation?.getCurrentPosition(
    pos => ymap.panTo([pos.coords.latitude, pos.coords.longitude], { flying: true }),
    () => showToast('Нет доступа к геолокации')
  );
}

function buildWaveform() {
  const wf = document.getElementById('wf');
  wf.innerHTML = '';
  for (let i = 0; i < 30; i++) {
    const b = document.createElement('div');
    b.className = 'wave-bar';
    b.style.cssText = `height:${(Math.random()*65+20).toFixed(0)}%;animation-delay:${(i*0.05).toFixed(2)}s`;
    wf.appendChild(b);
  }
}

function setWavePlaying(playing) {
  document.querySelectorAll('.wave-bar').forEach(b =>
    b.style.animationPlayState = playing ? 'running' : 'paused'
  );
}

function showLoading(txt) {
  document.getElementById('loading-text').textContent = txt;
  document.getElementById('loading').style.display = 'flex';
}
function hideLoading() { document.getElementById('loading').style.display = 'none'; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return s.replace(/"/g, '&quot;'); }
</script>
